[project]
name = "uniadapt-ai-backend"
version = "0.1.0"
description = "UniAdapt AI backend - FastAPI/SQLAlchemy/Alembic (Phase 1: Foundation)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "bcrypt>=4.0,<5.0",
  "pyjwt>=2.8,<3.0",
  "redis>=5.0,<6.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0,<2.0",
  "email-validator>=2.1,<3.0",
  # --- Phase 2 slice 2A (ADR-0013/0014/0015/0018; plan P-1, P-2, P-8) ---
  "pytesseract>=0.3.10,<0.4",       # ADR-0013 OCR wrapper (needs the tesseract binary in the image)
  "pdfplumber>=0.11,<0.12",         # ADR-0014 PDF text
  "pypdfium2>=4.30,<6",             # ADR-0014 page rasterisation for OCR
  "python-pptx>=1.0,<2.0",          # ADR-0014
  "python-docx>=1.1,<2.0",          # ADR-0014
  "pgvector>=0.3,<0.6",             # ADR-0019: SQLAlchemy Vector type for the pgvector column
  "minio>=7.2,<8.0",                # ADR-0019: MinIO Python SDK
  "celery>=5.4,<6.0",               # fixed stack; ingestion worker
  "Pillow>=10.0",                   # ADR-0019: OCR page images (also a pdfplumber dependency)
  # --- Phase 2 slice 2B (ADR-0016: LangChain Anthropic integration for the Curriculum Agent) ---
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
]

# Heavy local-inference stack (ADR-0015). Installed in the Docker image with a CPU-only
# torch wheel (`pip install --index-url https://download.pytorch.org/whl/cpu torch` first).
# Not needed for unit tests, which use fake embedder/tokenizer ports.

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0,<6",
  "transformers>=4.44",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app.services --cov-report=term-missing"
markers = [
  "pg: needs the compose PostgreSQL+pgvector service (docker compose up -d --wait postgres)",
  "minio: needs the compose MinIO service (docker compose up -d --wait minio)",
  "tesseract: needs the Tesseract binary (runs inside the backend Docker image / CI image)",
  "hf_model: loads the real BAAI/bge-m3 model/tokenizer (large HuggingFace download; HF_HOME cache)",
  "llm_live: calls a real LLM provider (slice 2B; needs an API key)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
