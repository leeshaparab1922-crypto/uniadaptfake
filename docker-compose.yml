# UniAdapt AI - Phase 1 orchestration.
#
# Phase 1's application code only truly exercises `backend` and `postgres`.
# `redis`, `minio`, and `celery` are provisioned here for forward
# compatibility with later phases per Section 5's fixed stack, and are not
# yet exercised by any Phase 1 endpoint beyond `rate_limit.py`'s Redis
# client construction.
services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: uniadapt
      POSTGRES_PASSWORD: uniadapt
      POSTGRES_DB: uniadapt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniadapt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
    command: celery -A app.workers worker --loglevel=info

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host

volumes:
  postgres_data:
  minio_data:
